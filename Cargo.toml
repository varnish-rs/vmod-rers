[package]
name = "vmod_rers"
version = "0.0.14"
edition = "2024"
publish = false

[dependencies]
lru = "0.18.0"
regex = "1.5"
varnish = { version = "0.7.0", features = ["ffi"] }

[lib]
crate-type = ["cdylib"]

[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
